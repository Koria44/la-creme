<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}La Creme | Pastelería Artesanal en Santiago{% endblock %}</title>

  <!-- Meta Description SEO (140-160 caracteres) -->
  <meta name="description"
    content="{% block meta_description %}Pastelería fina y artesanal en Providencia, Santiago. Exquisitas tortas, cheesecakes, kuchen y pastelería personalizada con despacho a domicilio.{% endblock %}">
  <meta name="author" content="LA CREME Pastelería">
  <meta name="robots" content="index, follow">

  <!-- Canonical URL -->
  <link rel="canonical" href="{% block canonical_url %}{{ request.build_absolute_uri }}{% endblock %}">

  <!-- Open Graph / Redes Sociales -->
  <meta property="og:site_name" content="LA CREME Pastelería">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:title"
    content="{% block og_title %}{% block title_og %}LA CREME | Pastelería Artesanal en Santiago{% endblock %}{% endblock %}">
  <meta property="og:description"
    content="{% block og_description %}Tortas artesanales, kuchenes, cheesecakes y pastelería fina elaborada con ingredientes premium y despacho a domicilio en Santiago.{% endblock %}">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  <meta property="og:image"
    content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}/static/img/og-lacreme.jpg{% endblock %}">
  <meta property="og:locale" content="es_CL">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title"
    content="{% block twitter_title %}{% block title_twitter %}LA CREME Pastelería Artesanal{% endblock %}{% endblock %}">
  <meta name="twitter:description"
    content="{% block twitter_description %}Pastelería tradicional y moderna en Santiago. Haz tu pedido en línea de forma rápida y segura.{% endblock %}">

  <!-- Preconnect Google Fonts para Rendimiento -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5.3 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos Propios LA CREME -->
  <link rel="stylesheet" href="/static/css/la_creme.css">

  <!-- JSON-LD Estructurado Global: Bakery / LocalBusiness -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Bakery",
      "name": "LA CREME Pastelería",
      "image": "{{ request.scheme }}://{{ request.get_host }}/static/img/og-lacreme.jpg",
      "description": "Pastelería artesanal y repostería fina con ingredientes de primera calidad.",
      "telephone": "{{ configuracion_sitio.telefono|default:'+56 9 8765 4321' }}",
      "email": "{{ configuracion_sitio.correo|default:'contacto@pastelerialacreme.cl' }}",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "{{ configuracion_sitio.direccion|default:'Av. Providencia 1234, Local 5' }}",
        "addressLocality": "{{ configuracion_sitio.comuna|default:'Providencia' }}",
        "addressRegion": "Región Metropolitana",
        "addressCountry": "CL"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": {{ configuracion_sitio.latitud|default:'-33.4285' }},
        "longitude": {{ configuracion_sitio.longitud|default:'-70.6123' }}
      },
      "priceRange": "$$",
      "currenciesAccepted": "CLP",
      "paymentAccepted": "Efectivo, Transferencia bancaria, Tarjetas de débito y crédito",
      "openingHours": "Mo-Sa 09:30-20:00, Su 10:00-18:00"
    }
    </script>

  {% block meta_extra %}{% endblock %}
  {% block extra_css %}{% endblock %}
</head>

<body>
  <!-- Accesibilidad: Saltar directamente al contenido -->
  <a href="#contenido-principal" class="skip-link">Saltar al contenido principal</a>

  <!-- Encabezado y Navegación -->
  {% include "includes/_navbar.html" %}

  <!-- Mensajes de Estado / Notificaciones -->
  {% include "includes/_mensajes.html" %}

  <!-- Contenido Principal Dinámico -->
  <main id="contenido-principal" role="main">
    {% block contenido %}{% endblock %}
  </main>

  <!-- Pie de Página -->
  {% include "includes/_footer.html" %}

  <!-- Contenedor Flotante para Notificaciones Toast (AJAX) -->
  <div id="toast-container-flotante" class="toast-container-lacreme" aria-live="polite" aria-atomic="true"></div>

  <!-- Bootstrap 5.3 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- JavaScript del Carrito y Utilidades -->
  <script src="/static/js/carrito.js"></script>

  {% block extra_js %}{% endblock %}
</body>

</html>
