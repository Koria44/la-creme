{% if messages %}
<div class="container mt-3 mb-2" role="region" aria-label="Mensajes del sistema">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm border-0 d-flex align-items-center gap-2" role="alert">
        {% if message.tags == 'success' %}
            <i class="bi bi-check-circle-fill fs-5"></i>
        {% elif message.tags == 'warning' %}
            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
        {% elif message.tags == 'danger' or message.tags == 'error' %}
            <i class="bi bi-x-octagon-fill fs-5"></i>
        {% else %}
            <i class="bi bi-info-circle-fill fs-5"></i>
        {% endif %}
        <div>{{ message }}</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
